<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel-2:#1c232d; --edge:#2a3542;
    --text:#e6edf3; --muted:#8b98a5; --dim:#6a7684;
    --accent:#4ade80; --accent-dim:#2a9d5c; --warn:#fbbf24; --link:#6ab0ff;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#ffffff; --panel:#f6f8fa; --panel-2:#eef1f5; --edge:#d9dee4;
      --text:#1c2128; --muted:#5a6572; --dim:#77818e;
      --accent:#1a7f42; --accent-dim:#1a7f42; --warn:#9a6700; --link:#0a58ca;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}

  /* header */
  header.top{border-bottom:1px solid var(--edge);background:var(--panel);
             position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
  header.top .wrap{display:flex;align-items:center;gap:18px;height:54px}
  header.top a.home{font-weight:700;color:var(--text);text-decoration:none;font-size:15px;white-space:nowrap}
  header.top nav{margin-left:auto;display:flex;gap:18px;font-size:14px}
  header.top nav a{color:var(--muted);text-decoration:none}
  header.top nav a:hover{color:var(--accent)}

  /* hero */
  .hero{padding:52px 0 34px;border-bottom:1px solid var(--edge)}
  .hero h1{margin:0 0 10px;font-size:40px;line-height:1.1;letter-spacing:-.02em}
  .hero p.lead{margin:0;color:var(--muted);font-size:18px;max-width:62ch}
  .badge{display:inline-block;background:var(--accent);color:var(--bg);font-weight:700;
         padding:2px 9px;border-radius:5px;font-size:13px;vertical-align:middle;margin-left:6px}
  @media (prefers-color-scheme: light){ .badge{color:#fff} }

  /* stat tiles */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:28px 0}
  .stat{background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:13px 14px}
  .stat .n{font-size:25px;font-weight:700;line-height:1.15;font-family:var(--mono);letter-spacing:-.02em}
  .stat .n.good{color:var(--accent)}
  .stat .l{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}

  /* content */
  main{padding:34px 0 60px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
     margin:40px 0 14px;font-weight:700;border-bottom:1px solid var(--edge);padding-bottom:8px}
  h3{font-size:18px;margin:28px 0 10px;letter-spacing:-.01em}
  p{margin:0 0 14px}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  ul,ol{margin:0 0 14px;padding-left:22px}
  li{margin:4px 0}
  hr{border:0;border-top:1px solid var(--edge);margin:34px 0}
  blockquote{margin:16px 0;padding:12px 16px;background:var(--panel);
             border-left:3px solid var(--warn);border-radius:0 7px 7px 0;color:var(--muted)}
  blockquote p:last-child{margin:0}

  /* tables: the main event */
  table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14.5px}
  th{text-align:left;padding:9px 12px;background:var(--panel-2);color:var(--muted);
     font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
     border-bottom:1px solid var(--edge);white-space:nowrap}
  td{padding:9px 12px;border-bottom:1px solid var(--edge);vertical-align:top}
  tbody tr:hover{background:var(--panel)}
  td:first-child{font-weight:600}
  table code{font-size:13px}

  code{background:var(--panel-2);padding:1.5px 5px;border-radius:4px;
       font-family:var(--mono);font-size:13.5px}
  pre{background:var(--panel);border:1px solid var(--edge);border-radius:9px;
      padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.55}
  pre code{background:none;padding:0;font-size:13px}

  /* card grid for docs */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:11px;margin:16px 0}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:9px;
        padding:14px 16px;text-decoration:none;color:var(--text);display:block;transition:.14s}
  .card:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-1px)}
  .card b{display:block;font-size:15px;margin-bottom:3px}
  .card span{color:var(--muted);font-size:13.5px;line-height:1.5}

  img{max-width:100%;height:auto;border-radius:9px;border:1px solid var(--edge)}

  /* photos */
  .shot{margin:22px 0}
  .shot img{width:100%;display:block;max-height:380px;object-fit:cover;object-position:center}
  .shot figcaption{color:var(--dim);font-size:13px;margin-top:7px;text-align:center}
  .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;margin:16px 0}
  .gallery figure{margin:0}
  .gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .gallery figcaption{color:var(--dim);font-size:12.5px;margin-top:6px;line-height:1.45}

  footer{border-top:1px solid var(--edge);padding:24px 0 40px;color:var(--dim);font-size:13.5px}
  footer a{color:var(--muted)}

  @media (max-width:640px){
    .hero{padding:34px 0 24px}
    .hero h1{font-size:29px}
    .hero p.lead{font-size:16px}
    header.top nav a:not(.gh){display:none}
    table{font-size:13.5px}
    th,td{padding:8px 9px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="home" href="{{ '/' | relative_url }}">🛠️ Junkyard Home Server</a>
    <nav>
      <a href="{{ '/#documentation' | relative_url }}">Docs</a>
      <a href="{{ '/#code' | relative_url }}">Code</a>
      <a class="gh" href="https://github.com/{{ site.github_username }}/{{ site.repo_name }}">GitHub ↗</a>
    </nav>
  </div>
</header>

{% if page.url == "/" %}
<div class="hero">
  <div class="wrap">
    <h1>{{ site.tagline }}</h1>
    <p class="lead">{{ site.lead }}</p>
  </div>
</div>
{% endif %}

<main>
  <div class="wrap">
    {% if page.url != "/" and page.title %}<h1 style="margin-top:0">{{ page.title }}</h1>{% endif %}
    {{ content }}
  </div>
</main>

<footer>
  <div class="wrap">
    Built from e-waste · <a href="https://github.com/{{ site.github_username }}/{{ site.repo_name }}">Source on GitHub</a> · MIT licence
  </div>
</footer>

</body>
</html>
